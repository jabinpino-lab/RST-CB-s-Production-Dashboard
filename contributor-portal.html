<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RST Team Contributor Portal</title><style>body{font-family:Arial,sans-serif;background:#f5f7f6;color:#17352b;margin:0}.wrap{max-width:1200px;margin:auto;padding:28px}.hero{background:#17382d;color:white;border-radius:18px;padding:30px;margin-bottom:18px}.hero h1{margin:5px 0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#fff;border:1px solid #e1e8e4;border-radius:14px;padding:18px}.card strong{display:block;font-size:28px;margin:8px 0}.toolbar{display:flex;gap:10px;margin:18px 0}.toolbar input,.toolbar select{padding:11px;border:1px solid #d7e1dc;border-radius:9px;flex:1}.tabs button{padding:10px 14px;border:0;background:#e9f1ed;border-radius:8px;margin-right:6px}.tabs button.active{background:#17382d;color:#fff}.table{overflow:auto;margin-top:14px}table{border-collapse:collapse;width:100%;min-width:800px}th,td{padding:12px;text-align:left;border-bottom:1px solid #edf1ef;font-size:13px}th{font-size:11px;color:#718079;text-transform:uppercase}.badge{padding:5px 8px;border-radius:20px;font-size:11px;font-weight:bold}.ok{background:#e4f4eb;color:#2d7655}.bad{background:#fae8e6;color:#a34b45}.muted{color:#82908b}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:16px}}</style></head><body><div class="wrap"><div class="hero"><div>RST TEAM</div><h1>Contributor Portal</h1><p>Attendance, quality performance and team resources in one place.</p></div><div class="cards"><div class="card"><span>Attendance records</span><strong id="ac">—</strong><small class="muted">loaded from tracker</small></div><div class="card"><span>Quality records</span><strong id="qc">—</strong><small class="muted">loaded from tracker</small></div><div class="card"><span>Quality average</span><strong id="qa">—</strong><small class="muted">available audit scores</small></div><div class="card"><span>Last refresh</span><strong id="lr">—</strong><small class="muted">browser time</small></div></div><div class="toolbar"><input id="q" placeholder="Search contributor, project, task ID..." oninput="render()"><select id="shift" onchange="render()"><option>All shifts</option><option>AM</option><option>PM</option></select></div><div class="tabs"><button id="btA" onclick="tab='a';render()">Attendance</button><button id="btQ" onclick="tab='q';render()">Quality</button></div><div class="panel table" id="out"></div></div><script>let d={attendance:[],quality:[]},tab='a';async function load(){let r=await fetch('contributor-data.json?'+Date.now());d=await r.json();document.getElementById('ac').textContent=d.attendance.length;document.getElementById('qc').textContent=d.quality.length;let s=d.quality.map(x=>+x.overallScore).filter(x=>x>0);document.getElementById('qa').textContent=s.length?(s.reduce((a,b)=>a+b,0)/s.length).toFixed(1)+'%':'—';document.getElementById('lr').textContent=new Date().toLocaleTimeString();render()}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let q=document.getElementById('q').value.toLowerCase(),sh=document.getElementById('shift').value;document.getElementById('btA').className=tab==='a'?'active':'';document.getElementById('btQ').className=tab==='q'?'active':'';if(tab==='a'){let a=d.attendance.filter(x=>(sh==='All shifts'||x.shift===sh)&&(!q||Object.values(x).join(' ').toLowerCase().includes(q)));document.getElementById('out').innerHTML='<table><thead><tr><th>Contributor</th><th>Shift</th><th>Status</th><th>Team</th><th>Skill</th><th>Trainer</th></tr></thead><tbody>'+a.map(x=>`<tr><td><b>${esc(x.name||'Contributor')}</b><br><small>${esc(x.emailMasked)}</small></td><td>${esc(x.shift)}</td><td><span class="badge ${x.status==='Present'?'ok':'bad'}">${esc(x.status)}</span></td><td>${esc(x.workerTeam||'—')}</td><td>${esc(x.skillLevel||'—')}</td><td>${esc(x.trainer||'—')}</td></tr>`).join('')+'</tbody></table>'}else{let a=d.quality.filter(x=>!q||Object.values(x).join(' ').toLowerCase().includes(q));document.getElementById('out').innerHTML='<table><thead><tr><th>Contributor</th><th>Project</th><th>Task ID</th><th>Audit</th><th>Auditor</th><th>Date</th><th>Score</th></tr></thead><tbody>'+a.map(x=>`<tr><td>${esc(x.displayName||'Contributor')}<br><small>${esc(x.emailMasked)}</small></td><td>${esc(x.project||'—')}</td><td>${esc(x.taskId||'—')}</td><td>${esc(x.auditType||'—')}</td><td>${esc(x.auditor||'—')}</td><td>${esc(x.date||x.auditDate||'—')}</td><td><b>${esc(x.overallScore||x.reviewedScore||'—')}${(x.overallScore||x.reviewedScore)?'%':''}</b></td></tr>`).join('')+'</tbody></table>'}}load()</script></body></html>
